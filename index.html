<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OB Scanner — Order Blocks</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">OB</span>
      <div>
        <strong>Order Block Scanner</strong>
        <span class="sub">ICT / Kasper ★ · scan only · no broker</span>
      </div>
    </div>
    <div class="controls">
      <label>
        Symbol
        <select id="symbolSelect"></select>
      </label>
      <div class="tf-group" role="group" aria-label="Timeframe">
        <button type="button" data-tf="M5">M5</button>
        <button type="button" data-tf="M15" class="active">M15</button>
        <button type="button" data-tf="H1">H1</button>
      </div>
      <label>
        Min ★
        <select id="minStars" title="Show only OBs with at least this many stars">
          <option value="0">0+</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4" selected>4+</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="chk">
        <input type="checkbox" id="showMitigated" checked />
        Show mitigated
      </label>
      <button type="button" id="btnRefresh" class="primary">Refresh</button>
    </div>
    <div id="status" class="status" aria-live="polite">Ready</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Detected OBs</h2>
        <span id="obCount" class="badge">0</span>
      </div>
      <div class="filters">
        <input id="filterText" type="search" placeholder="Filter list…" />
      </div>
      <ul id="obList" class="ob-list"></ul>
      <p class="hint">
        ★ = FVG + BOS + SWP + FR + PD (max 5). Default filter ≥4★.
        Displacement = body ≥ 1.5× avg(20) or close beyond prior 10-bar H/L.
        Dim zones on chart = unmitigated OBs meeting Min ★; click one for focus.
      </p>
    </aside>
    <section class="chart-pane">
      <div class="chart-meta">
        <span id="chartTitle">—</span>
        <span id="sourceNote" class="muted"></span>
      </div>
      <div id="chart" class="chart"></div>
      <div id="errorBanner" class="error-banner hidden"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
